<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Clicker</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      user-select: none;
      overflow: hidden;
    }

    h1 {
      font-size: 4rem;
      margin: 0 0 20px 0;
      color: #00ffcc;
    }

    button {
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      background: #ff007f;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px #ff007f;
      transition: transform 0.05s;
    }

    button:active {
      transform: scale(0.9);
    }

    .pop {
      position: absolute;
      font-weight: bold;
      font-size: 1.5rem;
      color: #00ffcc;
      pointer-events: none;
      animation: float 0.6s ease-out forwards;
    }

    @keyframes float {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
  </style>
</head>
<body>

  <h1 id="count">0</h1>
  <button id="btn">CLICK ME!</button>

  <script>
    let clicks = 0;
    const count = document.getElementById('count');
    const btn = document.getElementById('btn');

    btn.addEventListener('click', (e) => {
      clicks++;
      count.innerText = clicks;

      // Random background color pop
      document.body.style.backgroundColor = `hsl(${Math.random() * 360}, 20%, 10%)`;

      // Floating number effect
      const pop = document.createElement('div');
      pop.className = 'pop';
      pop.innerText = '+1';
      pop.style.left = `${e.clientX}px`;
      pop.style.top = `${e.clientY}px`;
      document.body.appendChild(pop);

      setTimeout(() => pop.remove(), 600);
    });
  </script>
</body>
</html>
